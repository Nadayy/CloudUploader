summary = "Cloud Uploader"
description = "Sube un archivo, o graba y sube audio del micrófono o de la computadora, de forma anónima al servidor que elijas. NVDA+alt+o abre un menú: U para subir un archivo, R para grabar y subir, B para iniciar la grabación en segundo plano, H para el historial de subidas. Una vez iniciada la grabación en segundo plano, presiona NVDA+alt+o de nuevo para detenerla."
